{# templates/auth/login.html #}
{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-sm py-4 sm:py-10">
    <div class="mb-6 text-center">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="" class="mx-auto -my-3 h-20 w-auto dark:hidden">
        <img src="{{ url_for('static', filename='logo-dark.png') }}" alt="" class="mx-auto -my-3 hidden h-20 w-auto dark:block">
        <h1 class="page-title mt-4">Log in to Castle</h1>
        <p class="page-subtitle">Welcome back. Sign in to keep scouting.</p>
    </div>

    <div class="card p-5 sm:p-6">
        <form method="POST" autocomplete="off" class="flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="login" class="label">Email or username</label>
                <input type="text"
                       id="login"
                       name="login"
                       class="input py-2.5"
                       value="{{ form_data.get('login', '') }}"
                       autocapitalize="none"
                       required>
            </div>

            <div>
                <div class="mb-1.5 flex items-center justify-between">
                    <label for="password" class="label mb-0">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="link text-sm">Forgot password?</a>
                </div>
                <div class="relative">
                    <input type="password"
                           id="password"
                           name="password"
                           class="input py-2.5 pr-11"
                           required>
                    <button type="button"
                            class="absolute inset-y-0 right-0 flex w-11 items-center justify-center rounded-r-lg text-zinc-400 transition-colors hover:text-zinc-600 dark:hover:text-zinc-200"
                            aria-label="Show or hide password"
                            onclick="togglePassword()">
                        <svg class="h-5 w-5" id="eye-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <label for="remember" class="flex items-center gap-2 text-sm text-zinc-700 dark:text-zinc-300">
                <input type="checkbox"
                       id="remember"
                       name="remember"
                       class="checkbox"
                       {% if form_data.get('remember') %}checked{% endif %}>
                Remember me
            </label>

            <button type="submit" class="btn btn-primary w-full py-2.5">
                Log in
            </button>
        </form>
    </div>

    <p class="mt-6 text-center text-sm text-zinc-500 dark:text-zinc-400">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}" class="link">Sign up</a>
    </p>
</div>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7-1.274 4.057-5.064 7-9.543 7z" />
        `;
    } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
    }
}
</script>
{% endblock %}
