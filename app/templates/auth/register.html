{# templates/auth/register.html #}
{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="mx-auto w-full max-w-sm py-4 sm:py-10">
    <div class="mb-6 text-center">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="" class="mx-auto -my-3 h-20 w-auto dark:hidden">
        <img src="{{ url_for('static', filename='logo-dark.png') }}" alt="" class="mx-auto -my-3 hidden h-20 w-auto dark:block">
        <h1 class="page-title mt-4">Create your account</h1>
        <p class="page-subtitle">Sign up to start scouting with your team.</p>
    </div>

    <div class="card p-5 sm:p-6">
        <form method="POST" autocomplete="off" class="flex flex-col gap-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="email" class="label">Email address</label>
                <input type="email"
                       id="email"
                       name="email"
                       class="input py-2.5"
                       value="{{ form_data.get('email', '') }}"
                       required>
            </div>

            <div>
                <label for="username" class="label">Username</label>
                <input type="text"
                       id="username"
                       name="username"
                       class="input py-2.5"
                       value="{{ form_data.get('username', '') }}"
                       autocapitalize="none"
                       required>
            </div>

            <div>
                <label for="password" class="label">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="input py-2.5"
                       required>
                <div class="password-strength-meter mt-2 h-1 overflow-hidden rounded-full bg-zinc-200 dark:bg-zinc-800">
                    <div class="strength-bar h-full w-0 rounded-full transition-all duration-300"></div>
                </div>
                <div class="password-requirements mt-3 space-y-1.5 text-sm text-zinc-500 dark:text-zinc-400">
                    <div class="requirement-item flex items-center gap-2" data-requirement="length">
                        <span class="check-icon unmet flex h-4 w-4 items-center justify-center rounded-full border border-zinc-300 text-[10px] leading-none dark:border-zinc-600">•</span>
                        At least 8 characters
                    </div>
                    <div class="requirement-item flex items-center gap-2" data-requirement="match">
                        <span class="check-icon unmet flex h-4 w-4 items-center justify-center rounded-full border border-zinc-300 text-[10px] leading-none dark:border-zinc-600">•</span>
                        Passwords match
                    </div>
                </div>
            </div>

            <div>
                <label for="confirm_password" class="label">Confirm password</label>
                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       class="input py-2.5"
                       required>
            </div>

            <button type="submit"
                    id="register-button"
                    class="btn btn-primary w-full py-2.5">
                Create account
            </button>
        </form>
    </div>

    <p class="mt-6 text-center text-sm text-zinc-500 dark:text-zinc-400">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="link">Log in</a>
    </p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm_password');
    const registerButton = document.getElementById('register-button');
    const strengthBar = document.querySelector('.strength-bar');

    function checkPasswordStrength(password) {
        const confirmPassword = document.getElementById('confirm_password').value;
        const checks = {
            length: password.length >= 8,
            match: password === confirmPassword && confirmPassword.length > 0
        };

        Object.entries(checks).forEach(([requirement, isPassing]) => {
            const reqElement = document.querySelector(`[data-requirement="${requirement}"]`);
            const checkIcon = reqElement.querySelector('.check-icon');

            if (isPassing) {
                reqElement.classList.add('met', 'text-green-700', 'dark:text-green-400');
                checkIcon.classList.remove('unmet', 'border-zinc-300', 'dark:border-zinc-600');
                checkIcon.classList.add('met', 'bg-green-50', 'border-green-500', 'text-green-600', 'dark:bg-green-500/10', 'dark:text-green-400');
                checkIcon.textContent = '✓';
            } else {
                reqElement.classList.remove('met', 'text-green-700', 'dark:text-green-400');
                checkIcon.classList.remove('met', 'bg-green-50', 'border-green-500', 'text-green-600', 'dark:bg-green-500/10', 'dark:text-green-400');
                checkIcon.classList.add('unmet', 'border-zinc-300', 'dark:border-zinc-600');
                checkIcon.textContent = '•';
            }
        });

        strengthBar.className = 'strength-bar h-full rounded-full transition-all duration-300';

        if (password.length === 0) {
            strengthBar.classList.add('w-0');
        } else if (password.length >= 2 && password.length < 4) {
            strengthBar.classList.add('w-1/4', 'bg-red-500');
        } else if (password.length >= 4 && password.length < 6) {
            strengthBar.classList.add('w-2/4', 'bg-amber-500');
        } else if (password.length >= 6 && password.length < 8) {
            strengthBar.classList.add('w-3/4', 'bg-blue-500');
        } else if (password.length >= 8) {
            strengthBar.classList.add('w-full', 'bg-green-500');
        }

        return Object.values(checks).every(Boolean);
    }

    function validatePasswords() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        const isStrong = checkPasswordStrength(password);
        const isMatching = password === confirmPassword;

        registerButton.disabled = !(isStrong && isMatching && confirmPassword.length > 0);
    }

    passwordInput.addEventListener('input', validatePasswords);
    confirmPasswordInput.addEventListener('input', validatePasswords);
});
</script>
{% endblock %}
