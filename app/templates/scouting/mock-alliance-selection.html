{% extends "base.html" %}
{% block content %}
<div>
    <div class="page-header">
        <div>
            <h1 class="page-title">Mock alliance selection</h1>
            <p class="page-subtitle">Simulate the FRC alliance selection process and playoff bracket.</p>
        </div>
        <nav class="flex gap-2" aria-label="Scouting tools">
            <a href="{{ url_for('scouting.leaderboard') }}" class="btn btn-secondary btn-sm">Leaderboard</a>
            <a href="{{ url_for('scouting.home') }}" class="btn btn-secondary btn-sm">Scouting</a>
        </nav>
    </div>

    <!-- Event Selection -->
    <div class="card mb-6">
        <div class="card-header">
            <h2 class="section-title">Select event</h2>
        </div>
        <div class="card-body">
            <div class="grid grid-cols-1 gap-4 md:grid-cols-[minmax(0,1fr)_minmax(0,1.5fr)_auto] md:items-end">
                <div>
                    <label for="year-select" class="label">Year</label>
                    <div class="flex gap-2">
                        <input type="number"
                               id="year-select"
                               min="1992"
                               inputmode="numeric"
                               placeholder="e.g. 2025"
                               class="input min-w-0 flex-1">
                        <button id="search-events-btn" type="button"
                                class="btn btn-secondary">
                            Search events
                        </button>
                    </div>
                </div>
                <div class="group relative">
                    <label for="event-search-input" class="label">Event / regional</label>
                    <div class="relative">
                        <input type="text"
                               id="event-search-input"
                               placeholder="Search for events first..."
                               class="input pr-9 disabled:cursor-not-allowed disabled:bg-zinc-50 disabled:text-zinc-400 dark:disabled:bg-zinc-800/50"
                               disabled
                               autocomplete="off">
                        <div id="event-dropdown_arrow" class="absolute inset-y-0 right-0 flex cursor-pointer items-center pr-2.5 text-zinc-400 hover:text-zinc-600 dark:text-zinc-500 dark:hover:text-zinc-300">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                        <input type="hidden" id="event-select" value="">

                        <ul id="event-dropdown-list"
                            class="absolute z-50 mt-1 hidden max-h-60 w-full overflow-y-auto rounded-lg border border-zinc-200 bg-white p-1 shadow-lg dark:border-zinc-800 dark:bg-zinc-900">
                            <!-- Options will be populated via JS -->
                        </ul>
                    </div>
                </div>
                <div>
                    <button id="load-rankings-btn" type="button"
                            class="btn btn-primary w-full md:w-auto">
                        Load rankings
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Selection Status -->
    <div id="selection-status" class="mb-6 hidden">
        <div class="flex items-center gap-3 rounded-lg border border-blue-200 bg-blue-50 px-4 py-3 dark:border-blue-500/30 dark:bg-blue-500/10">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-zinc-500 dark:text-zinc-400" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                </svg>
            </div>
            <div class="min-w-0">
                <p id="status-text" class="text-sm font-medium text-blue-800 dark:text-blue-300"></p>
            </div>
        </div>
    </div>

    <!-- Notification Banner Area -->
    <div id="notification-area" class="mb-6 empty:mb-0">
        <!-- Notifications will be dynamically inserted here -->
    </div>

    <!-- Split Screen Layout -->
    <div id="split-view" class="grid hidden grid-cols-1 gap-6 lg:grid-cols-2">
        <!-- Left Side: Alliances -->
        <div class="card min-w-0">
            <div class="card-header">
                <h2 class="section-title">Alliances</h2>
            </div>
            <div class="card-body">
                <div id="alliance-grid" class="grid max-h-[600px] grid-cols-1 gap-3 overflow-y-auto sm:grid-cols-2 lg:max-h-[800px]">
                    <!-- Alliances will be dynamically generated here -->
                </div>
            </div>
        </div>

        <!-- Right Side: Available Teams -->
        <div class="card min-w-0">
            <div class="card-header">
                <h2 class="section-title">Available teams</h2>
            </div>
            <div class="card-body">
                <div class="mb-4">
                    <input type="text"
                           id="team-search"
                           placeholder="Search teams by number or name"
                           aria-label="Search teams"
                           class="input">
                </div>
                <div id="available-teams-list" class="grid max-h-[500px] grid-cols-2 gap-2 overflow-y-auto sm:grid-cols-3 lg:max-h-[680px] lg:grid-cols-2 xl:grid-cols-3">
                    <!-- Available teams will be dynamically generated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Control Buttons -->
    <div id="control-buttons" class="mt-6 flex hidden flex-wrap gap-2">
        <button id="reset-btn" type="button"
                class="btn btn-secondary text-red-600 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300">
            Reset selection
        </button>
        <button id="start-bracket-btn" type="button"
                class="btn btn-primary hidden">
            Start bracket
        </button>
        <button id="export-btn" type="button"
                class="btn btn-secondary">
            Export results
        </button>
        <button id="export-playoff-btn" type="button" onclick="exportPlayoffResults()"
                class="btn btn-secondary">
            Export playoff results
        </button>
    </div>

    <!-- Bracket View -->
    <div id="bracket-view" class="mt-10 hidden">
        <h2 class="section-title mb-4">Double elimination playoff bracket</h2>

        <div class="card overflow-x-auto">
            <div class="flex min-w-[1200px] flex-col gap-12 p-6">
                <!-- Upper Bracket -->
                <div>
                    <h3 class="mb-4 ml-4 text-sm font-semibold text-zinc-900 dark:text-zinc-100">Upper bracket</h3>
                    <div class="flex items-center justify-around">
                        <!-- Round 1 -->
                        <div class="flex flex-col gap-8" id="upper-round-1"></div>
                        <!-- Round 2 -->
                        <div class="flex flex-col gap-16" id="upper-round-2"></div>
                        <!-- Round 3 (Semis) -->
                        <div class="flex flex-col gap-32" id="upper-round-3"></div>
                        <!-- Finals -->
                        <div class="flex flex-col gap-8" id="finals-round"></div>
                    </div>
                </div>

                <!-- Lower Bracket -->
                <div class="border-t border-zinc-200 pt-8 dark:border-zinc-800">
                    <h3 class="mb-4 ml-4 text-sm font-semibold text-zinc-900 dark:text-zinc-100">Lower bracket</h3>
                    <div class="flex items-center justify-around">
                        <!-- Round 1 -->
                        <div class="flex flex-col gap-8" id="lower-round-1"></div>
                        <!-- Round 2 -->
                        <div class="flex flex-col gap-8" id="lower-round-2"></div>
                        <!-- Round 3 -->
                        <div class="flex flex-col gap-8" id="lower-round-3"></div>
                         <!-- Round 4 (Lower Final) -->
                        <div class="flex flex-col gap-8" id="lower-round-4"></div>
                         <!-- Spacer for alignment with Finals -->
                        <div class="w-64"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Match Card Template -->
    <template id="match-card-template">
        <div class="match-card relative mb-6 w-64 overflow-visible rounded-xl border border-zinc-200 bg-white shadow-sm transition-shadow md:w-72 dark:border-zinc-800 dark:bg-zinc-900">
            <div class="match-header flex items-center justify-between rounded-t-xl border-b border-zinc-200 bg-zinc-50 px-3 py-2 dark:border-zinc-800 dark:bg-zinc-900">
                <span class="match-label text-xs font-medium text-zinc-500 dark:text-zinc-400">Match Title</span>
                <span class="match-id rounded bg-zinc-100 px-1.5 font-mono text-[10px] text-zinc-500 md:text-xs dark:bg-zinc-800 dark:text-zinc-400">ID</span>
            </div>

            <div class="space-y-1 p-2">
                <!-- Red Alliance -->
                <div class="alliance-option red group relative flex cursor-pointer items-center rounded-lg border border-transparent p-2 transition-colors hover:bg-zinc-50 dark:hover:bg-zinc-800/60">
                    <div class="absolute left-0 h-8 w-1 rounded-r-sm bg-red-500"></div>
                    <div class="seed-badge ml-2 mr-2 flex h-6 w-6 items-center justify-center rounded-full bg-red-50 text-[10px] font-semibold text-red-700 ring-1 ring-inset ring-red-600/20 md:text-xs dark:bg-red-500/10 dark:text-red-300 dark:ring-red-500/30">
                        ?
                    </div>
                    <div class="flex min-w-0 flex-1 flex-col justify-center">
                        <span class="team-number text-sm font-semibold leading-tight text-zinc-900 md:text-base dark:text-zinc-100">---</span>
                        <span class="alliance-teams mt-0.5 max-w-[140px] truncate text-[10px] tabular-nums text-zinc-500 md:text-xs dark:text-zinc-400"></span>
                    </div>
                     <div class="winner-icon mr-1 scale-0 transform text-green-600 opacity-0 transition-all duration-300 dark:text-green-400">
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    </div>
                </div>

                <!-- Blue Alliance -->
                <div class="alliance-option blue group relative flex cursor-pointer items-center rounded-lg border border-transparent p-2 transition-colors hover:bg-zinc-50 dark:hover:bg-zinc-800/60">
                    <div class="absolute left-0 h-8 w-1 rounded-r-sm bg-blue-500"></div>
                    <div class="seed-badge ml-2 mr-2 flex h-6 w-6 items-center justify-center rounded-full bg-blue-50 text-[10px] font-semibold text-blue-700 ring-1 ring-inset ring-blue-600/20 md:text-xs dark:bg-blue-500/10 dark:text-blue-300 dark:ring-blue-500/30">
                        ?
                    </div>
                    <div class="flex min-w-0 flex-1 flex-col justify-center">
                        <span class="team-number text-sm font-semibold leading-tight text-zinc-900 md:text-base dark:text-zinc-100">---</span>
                        <span class="alliance-teams mt-0.5 max-w-[140px] truncate text-[10px] tabular-nums text-zinc-500 md:text-xs dark:text-zinc-400"></span>
                    </div>
                    <div class="winner-icon mr-1 scale-0 transform text-green-600 opacity-0 transition-all duration-300 dark:text-green-400">
                        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    </div>
                </div>
            </div>
        </div>
    </template>
</div>

<style>
    .alliance-card {
        transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .alliance-card.active {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .team-slot {
        min-height: 52px;
        border-radius: 0.5rem;
        transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .team-slot.empty {
        border: 1px dashed #d4d4d8; /* zinc-300 */
        cursor: pointer;
    }

    .team-slot.filled {
        border: 1px solid #e4e4e7; /* zinc-200 */
        background-color: #fff;
    }

    .team-slot.captain {
        border: 1px solid #bfdbfe; /* blue-200 */
        background-color: #eff6ff; /* blue-50 */
    }

    .dark .team-slot.empty {
        border-color: #3f3f46; /* zinc-700 */
    }

    .dark .team-slot.filled {
        border-color: #3f3f46;
        background-color: #18181b; /* zinc-900 */
    }

    .dark .team-slot.captain {
        border-color: rgba(59, 130, 246, 0.3);
        background-color: rgba(59, 130, 246, 0.1);
    }

    .team-card {
        cursor: grab;
        transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
        touch-action: none;
        user-select: none;
    }

    .team-card:active {
        cursor: grabbing;
    }

    .team-card:hover:not(.declined):not(.selected-for-pick) {
        border-color: #a1a1aa; /* zinc-400 */
    }

    .dark .team-card:hover:not(.declined):not(.selected-for-pick) {
        border-color: #52525b; /* zinc-600 */
    }

    .team-card.declined {
        opacity: 0.5;
        cursor: not-allowed;
        background-color: #fef2f2;
    }

    .dark .team-card.declined {
        background-color: rgba(239, 68, 68, 0.1);
    }

    .team-card.dragging {
        opacity: 0.5;
    }

    .team-card.selected-for-pick {
        background-color: #eff6ff;
        border-color: #2563eb;
        box-shadow: 0 0 0 1px #2563eb;
    }

    .dark .team-card.selected-for-pick {
        background-color: rgba(59, 130, 246, 0.1);
        border-color: #3b82f6;
        box-shadow: 0 0 0 1px #3b82f6;
    }

    .team-slot.drag-over,
    .dark .team-slot.drag-over {
        background-color: rgba(59, 130, 246, 0.1);
        border-color: #3b82f6;
        border-style: solid;
    }

    .team-slot.empty:hover {
        background-color: #fafafa; /* zinc-50 */
        border-color: #a1a1aa; /* zinc-400 */
    }

    .dark .team-slot.empty:hover {
        background-color: rgba(39, 39, 42, 0.6);
        border-color: #52525b;
    }

    .team-slot.filled[data-action="remove"]:hover {
        border-color: #fca5a5; /* red-300 */
        background-color: #fef2f2; /* red-50 */
    }

    .dark .team-slot.filled[data-action="remove"]:hover {
        border-color: rgba(239, 68, 68, 0.4);
        background-color: rgba(239, 68, 68, 0.1);
    }

    @media (max-width: 1024px) {
        .pick-round-indicator {
            font-size: 0.65rem;
            padding: 0.125rem 0.375rem;
        }
    }

    .pick-round-indicator {
        font-size: 0.75rem;
        padding: 0.125rem 0.5rem;
        border-radius: 0.375rem;
        background-color: #2563eb;
        color: white;
        font-weight: 500;
    }

    .animate-fade-in {
        animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
<script src="{{url_for('static', filename='js/mock-alliance-selection.js')}}"></script>
<script src="{{url_for('static', filename='js/playoff-bracket.js')}}"></script>
{% endblock %}
