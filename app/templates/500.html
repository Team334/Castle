{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="flex min-h-[60vh] items-center justify-center">
    <div class="w-full max-w-md text-center">
        <div class="mx-auto mb-6 flex h-12 w-12 items-center justify-center rounded-xl border border-zinc-200 bg-white text-zinc-500 shadow-sm dark:border-zinc-800 dark:bg-zinc-900 dark:text-zinc-400">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </div>

        <p class="text-sm font-semibold text-blue-600 dark:text-blue-400">500</p>
        <h1 class="page-title mt-1">Something went wrong</h1>
        <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">The server ran into a problem. Try again in a minute.</p>

        <div class="mt-8 flex flex-col-reverse justify-center gap-3 sm:flex-row">
            <button type="button" onclick="history.back()" class="btn btn-secondary py-2.5 sm:py-2">
                Go back
            </button>
            <a href="{{ url_for('index') }}" class="btn btn-primary py-2.5 sm:py-2">
                Go home
            </a>
        </div>
    </div>
</div>
{% endblock %}
